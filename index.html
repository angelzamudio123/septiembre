<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Presentación de México</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #FF0000;
            font-family: Arial, sans-serif;
            border: 4px solid black;
            position: relative;
            overflow: hidden;
        }

        /* Título */
        .titulo {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: black;
            width: 800px;
        }

        .titulo pequeño {
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .titulo h1 {
            font-family: "Times New Roman", serif;
            font-size: 100px;
            margin: 0;
            line-height: 110px;
        }

        /* Botones en horizontal */
        .menu {
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            gap: 15px;
            width: auto;
        }

        .boton {
            width: 200px;
            height: 62px;
            background-color: #008c45;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 7px;
            font-size: 19px;
            color: black;
            text-decoration: none;
        }

        .boton:hover {
            background-color: #007238;
        }

        /* IMAGEN */
        .personaje {
            position: absolute;
            top: 390px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .personaje img {
            width: 500px;
            height: 300px;
            object-fit: contain;
            display: block;
        }

        /* Datos del alumno */
        .datos {
            position: absolute;
            left: 1150px;
            bottom: 50px;
            width: 800px;
            font-size: 25px;
            line-height: 30px;
        }

        .datos p {
            margin: 0;
        }

        .linea {
            width: 600px;
            height: 3px;
            background-color: black;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <!-- MENÚ -->
    <div class="menu">

        <a href="linea del tiempo.html" class="boton">
            Linea del<br>tiempo
        </a>

        <a href="personajes.html" class="boton">
            Personajes<br>ilustres
        </a>

        <a href="datos.html" class="boton">
            Datos<br>curiosos
        </a>

        <a href="mitos.html" class="boton">
            Mitos
        </a>

    </div>

    <!-- TÍTULO -->
    <div class="titulo">
        <pequeño>PRESENTACIÓN DE</pequeño>
        <h1>MÉXICO</h1>
    </div>

    <!-- IMAGEN DE MIGUEL HIDALGO -->
    <div class="personaje">
        <img src="elmiguel.PNG" alt="Miguel Hidalgo">
    </div>

    <!-- DATOS DEL ALUMNO -->
    <div class="datos">

        <p>ANGEL EDUARDO ZAMUDIO VEGA</p>
        <p>5-I</p>
        <p>24308051280679</p>

        <div class="linea"></div>

    </div>

</body>
</html>
