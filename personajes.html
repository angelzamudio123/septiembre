<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Personajes ilustres</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .pagina {
            display: flex;
            min-height: 100vh;
            border: 1px solid black;
            box-sizing: border-box;
        }

        .contenido {
            width: 89%;
            padding: 10px;
            box-sizing: border-box;
        }

        .verde {
            width: 11%;
            background-color: #008040;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: normal;
            margin: 2px 0 15px 0;
        }

        /* BLOQUE DE IMAGENES */
        .personajes {
            display: grid;

            /* 4 imágenes por fila */
            grid-template-columns: repeat(4, 140px);

            /* Espacio entre imágenes */
            gap: 35px;

            /* Centrar las 8 imágenes */
            justify-content: center;

            margin: auto;
        }

        .personaje {
            text-align: center;
        }

        /* TODAS LAS IMAGENES MISMO TAMAÑO */
        .personaje img {
            width: 175px;
            height: 250px;

            /* Recorta la imagen para que todas tengan el mismo tamaño */
            object-fit: cover;

            display: block;
        }

        .nombre {
            font-family: "Times New Roman", serif;
            font-size: 10px;
            font-weight: bold;
            margin-top: 3px;
            white-space: nowrap;
        }

    </style>
</head>

<body>

    <div class="pagina">

        <div class="contenido">

            <h1>Personajes ilustres</h1>

            <div class="personajes">

                <!-- Miguel Hidalgo --> 
                <div class="personaje"> 
                    <img src="miguel hidalgo.png" alt="Miguel Hidalgo "> 
                    <div class="nombre">MIGUEL HIDALGO </div> </div> 
                <!-- José María Morelos --> 
                <div class="personaje"> 
                    <img src="morelos.png" alt="José María Morelos y Pavón"> 
                    <div class="nombre">JOSE MARIA MORELOS Y PAVON</div> </div> 
                <!-- Benito Juárez --> 
                <div class="personaje"> 
                    <img src="benito.png" alt="Benito Juárez"> 
                    <div class="nombre">BENITO JUAREZ</div> </div> 
                <!-- Josefa Ortiz --> 
                <div class="personaje"> 
                    <img src="josefa.png" alt="Josefa Ortiz de Domínguez"> 
                    <div class="nombre">JOSEFA ORTIZ DE DOMINGUEZ</div> </div> 
                <!-- Vicente Guerrero --> 
                <div class="personaje"> 
                    <img src="vicente.png" alt="Vicente Guerrero"> 
                    <div class="nombre">VICENTE GUERRERO</div> </div> 
                <!-- Agustín de Iturbide --> 
                <div class="personaje"> 
                    <img src="agustin.png" alt="Agustín de Iturbide"> 
                    <div class="nombre">AGUSTIN DE ITURBIDE</div> </div> 
                <!-- Emiliano Zapata --> 
                <div class="personaje"> 
                    <img src="emiliano.png" alt="Emiliano Zapata"> 
                    <div class="nombre">EMILIANO ZAPATA</div> </div> 
                <!-- Francisco I. Madero --> 
                <div class="personaje"> 
                    <img src="madero.png" alt="Francisco I. Madero"> 
                    <div class="nombre">FRANCISCO I. MADERO</div> </div>

            </div>

        </div>

        <div class="verde"></div>

    </div>

</body>

</html>
